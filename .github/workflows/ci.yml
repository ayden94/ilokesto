name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact changeset release PR head SHA
        required: true
        type: string
      release_pr_number:
        description: Changeset release PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/changeset-release/main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate release dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF" == "refs/heads/changeset-release/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD_SHA" ]]

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          readarray -t fields < <(
            jq -r '.state, .base.ref, .head.ref, .head.repo.full_name, .head.sha' <<<"$pr_json"
          )

          [[ "${fields[0]}" == "open" ]]
          [[ "${fields[1]}" == "main" ]]
          [[ "${fields[2]}" == "changeset-release/main" ]]
          [[ "${fields[3]}" == "$GITHUB_REPOSITORY" ]]
          [[ "${fields[4]}" == "$EXPECTED_HEAD_SHA" ]]

          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/changeset-release/main" \
              --jq '.object.sha'
          )"
          [[ "$current_sha" == "$EXPECTED_HEAD_SHA" ]]

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @ilokesto/modal exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Test workspace build graph
        run: pnpm test:monorepo

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

      - name: Typecheck state tests
        run: pnpm --filter @ilokesto/state test:typecheck

      - name: Verify modal package
        run: pnpm --filter @ilokesto/modal test:pack

      - name: Test modal end-to-end behavior
        run: pnpm --filter @ilokesto/modal test:e2e

      - name: Test modal accessibility
        run: pnpm --filter @ilokesto/modal test:a11y

      - name: Verify fetcher distribution
        run: pnpm --filter @ilokesto/fetcher test:dist

      - name: Check changesets
        run: pnpm changeset:status
